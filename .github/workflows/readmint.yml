name: Readmint
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "readmint/designs/**"
      - ".github/workflows/readmint.yml"
permissions:
  contents: write
concurrency:
  group: readmint
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MrLarkyy/Readmint@v0.5.1
        with:
          login: MrLarkyy
          token: ${{ secrets.PROFILE }}
          commit-message: Update Readmint graphics
          manifest: readmint/designs/year-ring/renders.json
          props-file: readmint/designs/year-ring/settings.json
